name: Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['UniversalVideoConverterPRO.py', '.github/workflows/windows-exe.yml']
  pull_request:
    paths: ['UniversalVideoConverterPRO.py', '.github/workflows/windows-exe.yml']
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.16.0
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name UniversalVideoConverterPRO UniversalVideoConverterPRO.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: UniversalVideoConverterPRO-Windows-x64
          path: dist/UniversalVideoConverterPRO.exe
          if-no-files-found: error
